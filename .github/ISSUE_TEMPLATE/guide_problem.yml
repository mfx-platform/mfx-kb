name: A guide or sample is wrong or unclear
description: A step that does not work, or does not say enough.
labels: [docs]
body:
  - type: markdown
    attributes:
      value: |
        Leave out API keys, private keys, broker logins, passwords and anything else that
        identifies an account.
  - type: input
    id: where
    attributes:
      label: Which guide or sample, and which step
      placeholder: guides/your-first-terminal.md, step 3
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error
      description: The SDK masks secrets in its own output; check anything else you paste.
      render: text
  - type: input
    id: versions
    attributes:
      label: SDK and Python version
      placeholder: mfx-sdk 0.9.15, Python 3.12.7
