# Every guide quotes a sample, and every sample is a real file. Each one parses, each one a guide
# quotes exists, nothing in the repository cites anything internal, and the samples run against
# MFX Hub's development environment: a sample that stops working fails the build instead of
# misleading a reader.
name: samples

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Every sample parses
        run: python -m compileall -q samples ci
      - name: Every sample a guide quotes exists
        run: |
          set -euo pipefail
          missing=0
          for ref in $(grep -rhoE '\.\./samples/[A-Za-z0-9_./-]+' guides | sort -u); do
            [ -f "guides/$ref" ] || { echo "::error::guides quote $ref, which does not exist"; missing=1; }
          done
          exit $missing
      - name: Nothing internal in the repository
        run: python ci/check_public.py
      - name: The public tree exports clean (only where the knowledge base is written)
        if: hashFiles('ci/export_public.py') != ''
        run: python ci/export_public.py "$RUNNER_TEMP/public-tree"

  live:
    # The samples, run as a customer runs them, against dev. Read-only on every push; the key is
    # the repository's, never a contributor's, so a pull request from a fork does not get it and
    # this job then says so and stops.
    runs-on: ubuntu-latest
    needs: samples
    env:
      MFX_BASE_URL: https://api.dev.mfxhub.com/v1
      MFX_KEY_ID: ${{ secrets.MFX_KEY_ID }}
      MFX_PRIVATE_KEY: ${{ secrets.MFX_PRIVATE_KEY }}
      MFX_TERMINAL_ID: ${{ secrets.MFX_TERMINAL_ID }}
      MFX_BROKER_ID: ${{ secrets.MFX_BROKER_ID }}
      MFX_SERVER_ID: ${{ secrets.MFX_SERVER_ID }}
      MFX_SYMBOL: ${{ secrets.MFX_SYMBOL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Is a dev key configured?
        id: key
        run: |
          if [ -z "$MFX_KEY_ID" ] || [ -z "$MFX_PRIVATE_KEY" ]; then
            echo "::notice::no dev key in this repository's secrets, so the samples are not run here"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the SDK the samples use
        if: steps.key.outputs.configured == 'true'
        # The exact versions in ci/requirements.txt, each checked against its hash.
        run: python -m pip install --quiet --require-hashes -r ci/requirements.txt
      - name: Run the read-only samples against dev
        if: steps.key.outputs.configured == 'true'
        run: python ci/run_samples.py
